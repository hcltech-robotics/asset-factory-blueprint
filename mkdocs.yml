site_name: Asset Factory Blueprint
site_description: Governed, reproducible OpenUSD assets and Isaac Lab RL environments from photos, scans, CAD and USD. MIT-licensed, from the HCLTech Robotics Intelligence CoE.
site_url: https://hcltech-robotics.github.io/asset-factory-blueprint/
site_author: Chris von Csefalvay
repo_url: https://github.com/hcltech-robotics/asset-factory-blueprint
repo_name: hcltech-robotics/asset-factory-blueprint
docs_dir: docs
site_dir: site
exclude_docs: |
  overrides/
strict: true
use_directory_urls: false

theme:
  name: material
  custom_dir: docs/overrides
  language: en
  features:
    - content.code.annotate
    - content.code.copy
    - navigation.footer
    - navigation.instant
    - navigation.instant.progress
    - navigation.sections
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - search.highlight
    - search.suggest
    - toc.follow
  font: false
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: hcltech-light
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Use dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: hcltech-dark
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Use light mode
  logo: assets/images/hcltech-logo-white.svg
  favicon: assets/images/hcltech-robotics-mark.svg

extra:
  brand_title: Asset Factory Blueprint
  publisher_name: HCLTech Robotics Intelligence CoE
  publisher_url: https://github.com/hcltech-robotics
  parent_org_name: HCLTech
  parent_org_url: https://www.hcltech.com/
  software_version: 1.1.0
  release_date: 2026-08-31
  concept_doi: 10.5281/zenodo.22201829
  version_doi: 10.5281/zenodo.22201830
  archive_url: https://zenodo.org/records/22201830
  archive_download_url: https://zenodo.org/api/records/22201830/files/hcltech-robotics/asset-factory-blueprint-v1.1.0.zip/content
  software_keywords:
    - OpenUSD
    - SimReady
    - robotics
    - simulation
    - asset pipeline
    - reinforcement learning
    - Isaac Lab
    - provenance
  authors:
    - name: Chris von Csefalvay
      orcid: https://orcid.org/0000-0003-3131-0864
      url: https://chrisvoncsefalvay.com/
    - name: Tamas Foldi
      orcid: https://orcid.org/0000-0001-9283-6865
      url: https://github.com/tfoldi
  software_description: >-
    Asset Factory Blueprint (AFB) is an MIT-licensed reference implementation from the HCLTech Robotics Intelligence CoE that turns photos, scans, CAD and USD sources into governed, reproducible OpenUSD assets and Isaac Lab reinforcement learning environments for robotics simulation, with every geometry, physics and variant decision verified against SimReady requirements and tied to recorded evidence.
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/hcltech-robotics/asset-factory-blueprint
      name: Asset Factory Blueprint on GitHub

plugins:
  - search
  - bibtex:
      bib_file: references.bib
      csl_file: docs/assets/citation-style/harvard-cite-them-right.csl
      bib_by_default: false
      enable_inline_citations: false

hooks:
  - scripts/docs/bibliography_hook.py
  - scripts/docs/repository_pages_hook.py

markdown_extensions:
  - fenced_code
  - sane_lists
  - tables
  - toc:
      permalink: true
      permalink_title: Permanent link to this section
      title: On this page
  - admonition
  - attr_list
  - footnotes
  - md_in_html
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

nav:
  - Index: index.md
  - Quickstart: quickstart.md
  - Walkthrough: walkthrough.md
  - Runthrough: runthrough.md
  - Blueprint:
      - Blueprint: blueprint.md
